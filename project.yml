# XPadMac: xcodegen spec (xcodegen 2.46). Generate the project with
#   make project        (or: xcodegen generate)
#
# Two targets:
#   XPadMac     the SwiftUI host app (App/), macOS 14+
#   XPadDriver  the DriverKit extension (Driver/ + Shared/*.c), embedded in
#               the app at Contents/Library/SystemExtensions
#
# DEVELOPMENT_TEAM, BUNDLE_ID_PREFIX and the versions come from
# Config.xcconfig (and the git-ignored Config.local.xcconfig it includes);
# command-line build settings override them.
name: XPadMac

options:
  minimumXcodeGenVersion: 2.46.0
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    macOS: "14.0"

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    MACOSX_DEPLOYMENT_TARGET: "14.0"
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO

targets:
  XPadMac:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      # A driver-extension dependency with embed: true is copied into the
      # app's Contents/Library/SystemExtensions ("Embed System Extensions").
      - target: XPadDriver
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: XPadMac
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)xpadmac
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/XPadMac.entitlements
        # Automatic unless `make build APP_PROFILE=...` (see Config.xcconfig).
        CODE_SIGN_STYLE: $(XPAD_APP_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: $(XPAD_APP_PROFILE)
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Swift 6 language mode: the app builds clean with complete data-race
        # checking (verified with warnings as errors).
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        # Localization: English source strings in the code, Vietnamese in
        # App/Localizable.xcstrings (String Catalog). The compiler extracts
        # every LocalizedStringKey / String(localized:) literal; the app
        # follows the macOS language.
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO

  XPadDriver:
    type: driver-extension
    # xcodegen has no DriverKit platform: the target is declared macOS and
    # built against the DriverKit SDK (SDKROOT below), as Xcode's own
    # DriverKit template does.
    platform: macOS
    sources:
      - path: Driver
      - path: Shared
        includes:
          - "*.c"
          - "*.h"
    settings:
      base:
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "21.0"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)xpadmac.driver
        # sysextd expects a system extension's bundle to be named after its
        # identifier: <id>.dext (Apple's own dexts are named so as well).
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: Driver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Driver/XPadDriver.entitlements
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Shared
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        GCC_C_LANGUAGE_STANDARD: gnu11
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - DriverKit
          - -framework
          - USBDriverKit
          - -framework
          - HIDDriverKit
        LD_RUNPATH_SEARCH_PATHS: ""
        COMBINE_HIDPI_IMAGES: NO
        SKIP_INSTALL: YES
        WARNING_CFLAGS:
          - -Wall
          - -Wextra
          - -Wno-unused-parameter

schemes:
  # The app's scheme lists only the app: the driver is built (for DriverKit)
  # as its dependency. Listing both would restrict the scheme to DriverKit
  # destinations and `-destination 'generic/platform=macOS'` would not match.
  XPadMac:
    build:
      targets:
        XPadMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  XPadDriver:
    build:
      targets:
        XPadDriver: all
    run:
      config: Debug
    archive:
      config: Release
